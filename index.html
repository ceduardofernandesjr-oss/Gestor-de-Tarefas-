<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#4F46E5">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/logo-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Prio | Gestor de tarefas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            bg: 'var(--bg)',
            surface: 'var(--surface)',
            ink: 'var(--text)',
            muted: 'var(--muted)',
            line: 'var(--border)',
            brand: 'var(--primary)'
          }
        }
      }
    }
  </script>

  <style>
    /* ===== Tokens (tema claro / escuro) ===== */
    :root {
      --bg: #F8FAFC; --surface: #FFFFFF; --text: #0F172A; --muted: #475569; --border: #E2E8F0;
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-ink: #4F46E5; --primary-soft: #EEF2FF;
      --soft: #F1F5F9;
      --warn-bg: #FFFBEB; --warn-fg: #92400E;
      --danger-bg: #FFF1F2; --danger-fg: #BE123C;
      --ok-bg: #ECFDF5; --ok-fg: #047857;
      --scrim: rgba(15, 23, 42, .45);
      --border-soft: rgba(226, 232, 240, .7); --shadow: 0 2px 10px -4px rgba(0, 0, 0, .04);
      --track: rgba(226, 232, 240, .8); --prog: linear-gradient(90deg, #6366F1, #8B5CF6);
      --hero-bg: linear-gradient(to bottom right, rgba(238, 242, 255, .8), #FFFFFF, #FFFFFF); --hero-border: rgba(199, 210, 254, .8);
    }
    :root[data-theme="dark"] {
      --bg: #0B1220; --surface: #121A2B; --text: #E2E8F0; --muted: #94A3B8; --border: #243049;
      --primary: #4F46E5; --primary-hover: #4338CA; --primary-ink: #A5B4FC; --primary-soft: #1E2347;
      --soft: #1B2438;
      --warn-bg: #2B2210; --warn-fg: #FCD34D;
      --danger-bg: #331A22; --danger-fg: #FDA4AF;
      --ok-bg: #10281F; --ok-fg: #6EE7B7;
      --scrim: rgba(0, 0, 0, .6);
      --border-soft: #243049; --shadow: 0 2px 10px -4px rgba(0, 0, 0, .4);
      --track: #1B2438; --prog: linear-gradient(90deg, #6366F1, #8B5CF6);
      --hero-bg: linear-gradient(to bottom right, #1E2347, #121A2B, #121A2B); --hero-border: #3B3F86;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0B1220; --surface: #121A2B; --text: #E2E8F0; --muted: #94A3B8; --border: #243049;
        --primary: #4F46E5; --primary-hover: #4338CA; --primary-ink: #A5B4FC; --primary-soft: #1E2347;
        --soft: #1B2438;
        --warn-bg: #2B2210; --warn-fg: #FCD34D;
        --danger-bg: #331A22; --danger-fg: #FDA4AF;
        --ok-bg: #10281F; --ok-fg: #6EE7B7;
        --scrim: rgba(0, 0, 0, .6);
      --border-soft: #243049; --shadow: 0 2px 10px -4px rgba(0, 0, 0, .4);
      --track: #1B2438; --prog: linear-gradient(90deg, #6366F1, #8B5CF6);
      --hero-bg: linear-gradient(to bottom right, #1E2347, #121A2B, #121A2B); --hero-border: #3B3F86;
      }
    }

    /* ===== Base ===== */
    html { -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--text); -webkit-tap-highlight-color: transparent; }
    body.lock { overflow: hidden; }
    :focus-visible { outline: 2px solid var(--primary-ink); outline-offset: 2px; }
    button { cursor: pointer; }
    .hidden-view { display: none; }

    /* ===== Componentes reutilizáveis ===== */
    .card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 16px; box-shadow: var(--shadow); }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; font-size: .875rem;
           display: inline-flex; align-items: center; justify-content: center; gap: 6px;
           transition: background-color 200ms ease, transform 200ms ease; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-soft { background: var(--soft); color: var(--text); }
    .btn-ghost { color: var(--muted); }
    .btn-ghost:hover, .btn-soft:hover { background: var(--soft); }
    .btn-link { color: var(--primary-ink); font-weight: 600; font-size: .875rem; min-height: 44px; padding: 0 4px; }
    .field { width: 100%; min-height: 44px; background: var(--soft); border: 1px solid var(--border);
             border-radius: 12px; padding: 8px 12px; font-size: .875rem; color: var(--text); }
    .field:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    textarea.field { min-height: 72px; resize: vertical; }
    .label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .h-sec { font-size: .8125rem; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
    .pill { font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px;
            display: inline-flex; align-items: center; gap: 4px; }
    .pill-warn { background: var(--warn-bg); color: var(--warn-fg); }
    .pill-danger { background: var(--danger-bg); color: var(--danger-fg); }
    .pill-info { background: var(--primary-soft); color: var(--primary-ink); }
    .meta { display: inline-flex; align-items: center; gap: 4px; }
    .progress { height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
    .progress.lg { height: 8px; }
    .progress > i { display: block; height: 100%; border-radius: 999px; background: var(--prog); transition: all 500ms ease; }

    .btn-compact { padding: 0 14px; border-radius: 999px; }
    .stat { position: relative; padding: 12px; text-align: left; display: block; }
    .stat-ico { position: absolute; top: 12px; right: 12px; }
    .hero { background: var(--hero-bg); border: 1px solid var(--hero-border); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 12px 12px 8px; }
    .icon-btn { position: relative; flex: none; min-width: 40px; min-height: 40px; border-radius: 12px; background: var(--surface);
                border: 1px solid var(--border-soft); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .badge-count { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
                   background: var(--primary); color: #fff; font-size: .6875rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .search { width: 100%; min-height: 40px; background: var(--surface); border: 1px solid var(--border-soft); border-radius: 12px;
              padding: 6px 12px 6px 38px; font-size: .875rem; color: var(--text); box-shadow: var(--shadow); }
    .search:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    .chip-row { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 40px; padding: 0 14px; border-radius: 999px; font-size: .875rem; font-weight: 500; color: var(--muted);
            background: var(--surface); border: 1px solid var(--border-soft); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease; }
    .chip.on { background: var(--primary-soft); color: var(--primary-ink); border-color: var(--primary-soft);
               box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary-ink) 35%, transparent); }
    .chk { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; flex: none; }
    .chk .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--muted);
                display: flex; align-items: center; justify-content: center; color: #fff;
                transition: background-color 180ms ease, border-color 180ms ease; }
    .chk.done .box { background: var(--primary); border-color: var(--primary); }
    .task-row { display: flex; align-items: center; padding-right: 12px; transition: border-color 180ms ease; }
    .task-row:hover { border-color: var(--primary-ink); }

    .nav-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
               min-height: 56px; font-size: .75rem; font-weight: 500; color: var(--muted); }
    .nav-btn[aria-current="page"] { color: var(--primary-ink); font-weight: 600; }
    .nav-btn.side { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 44px; padding: 0 12px;
                    border-radius: 12px; font-size: .875rem; width: 100%; }
    .nav-btn.side[aria-current="page"] { background: var(--primary-soft); }

    .day-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; border-radius: 12px;
                min-height: 64px; font-size: .75rem; color: var(--muted); }
    .day-cell .num { font-size: .9375rem; font-weight: 600; color: var(--text);
                     width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 999px; }
    .day-cell.today .num { background: var(--primary); color: #fff; }
    .day-cell .dot { width: 5px; height: 5px; border-radius: 999px; background: var(--primary-ink); }
    .day-cell .dot.none { background: transparent; }

    /* ===== Painéis (bottom sheet no mobile, modal / painel lateral no desktop) ===== */
    .backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; opacity: 0; visibility: hidden;
                transition: opacity 200ms ease, visibility 0s linear 200ms; }
    .backdrop.open { opacity: 1; visibility: visible; transition: opacity 200ms ease; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; margin-inline: auto; max-width: 36rem;
             background: var(--surface); border-top: 1px solid var(--border); border-radius: 24px 24px 0 0;
             padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); z-index: 50; max-height: 90vh; overflow-y: auto;
             transform: translateY(100%); visibility: hidden;
             transition: transform 220ms cubic-bezier(.16, 1, .3, 1), visibility 0s linear 220ms; }
    .sheet.open { transform: none; visibility: visible;
                  transition: transform 220ms cubic-bezier(.16, 1, .3, 1), visibility 0s; }
    .sheet:focus { outline: none; }
    .grabber { width: 40px; height: 4px; border-radius: 999px; background: var(--border); margin: 0 auto 16px; }

    #toast { position: fixed; left: 16px; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); margin-inline: auto;
             max-width: 24rem; background: #0F172A; color: #F8FAFC; border-radius: 16px; padding: 4px 8px 4px 16px;
             display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 60;
             transform: translateY(24px); opacity: 0; visibility: hidden;
             transition: transform 200ms ease, opacity 200ms ease, visibility 0s linear 200ms; }
    #toast.show { transform: none; opacity: 1; visibility: visible; transition: transform 200ms ease, opacity 200ms ease; }
    #toast button { color: #A5B4FC; font-weight: 700; font-size: .875rem; min-height: 44px; padding: 0 12px; }

    @media (min-width: 1024px) {
      .sheet.modal { top: 50%; bottom: auto; left: 50%; right: auto; margin: 0; width: 520px; max-width: 92vw;
                     border: 1px solid var(--border); border-radius: 20px; max-height: 86vh;
                     transform: translate(-50%, -47%); opacity: 0;
                     transition: transform 220ms ease, opacity 220ms ease, visibility 0s linear 220ms; }
      .sheet.modal.open { transform: translate(-50%, -50%); opacity: 1;
                          transition: transform 220ms ease, opacity 220ms ease, visibility 0s; }
      #detail-panel { position: sticky; top: 0; height: 100vh; max-height: none; width: 380px; flex: none; margin: 0;
                      border-radius: 0; border-top: 0; border-left: 1px solid var(--border);
                      transform: none; visibility: visible; display: none; }
      #detail-panel.open { display: block; }
      #detail-panel .grabber { display: none; }
      #detail-backdrop { display: none; }
      #toast { bottom: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body class="font-sans antialiased">

  <div id="banner" class="hidden text-xs text-center px-4 py-2 pill-warn" role="status"></div>

  <div class="lg:flex min-h-screen">

    <!-- Menu lateral (desktop) -->
    <aside class="hidden lg:flex flex-col w-60 shrink-0 border-r border-line bg-surface sticky top-0 h-screen p-4 gap-6">
      <div class="flex items-center gap-2.5 px-1">
        <img src="icons/logo-96.png" width="32" height="32" class="w-8 h-8 rounded-xl" alt="" aria-hidden="true">
        <span class="text-base font-semibold tracking-tight">Prio</span>
      </div>
      <nav id="side-nav" class="flex flex-col gap-1" aria-label="Navegação principal"></nav>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <!-- Topo -->
      <header class="sticky top-0 z-20 border-b border-line px-4 py-2" style="background:var(--surface)">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
          <div class="flex items-center gap-2.5 lg:invisible">
            <img src="icons/logo-96.png" width="32" height="32" class="w-8 h-8 rounded-xl" alt="" aria-hidden="true">
            <span id="header-title" class="text-base font-semibold tracking-tight">Prio</span>
          </div>
          <div class="flex items-center gap-1">
            <button id="hdr-new" data-act="new" class="btn btn-primary btn-compact"><i data-lucide="plus" class="w-4 h-4"></i><span>Nova</span></button>
            <button data-act="settings" class="btn btn-ghost" style="min-width:44px;padding:0" aria-label="Perfil e configurações"><i data-lucide="user" class="w-5 h-5"></i></button>
          </div>
        </div>
      </header>

      <main class="w-full max-w-2xl mx-auto px-4 pt-5 pb-28 lg:pb-10">
        <section id="view-home" aria-label="Início"></section>

        <section id="view-calendar" class="hidden-view">
          <div class="mb-4">
            <h1 class="text-2xl font-semibold tracking-tight">Calendário</h1>
            <p class="text-sm text-muted">Agenda dos próximos 7 dias</p>
          </div>
          <div id="calendar-body" class="space-y-5"></div>
        </section>

        <section id="view-projects" class="hidden-view">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">Projetos</h1>
              <p class="text-sm text-muted">Organize por objetivos</p>
            </div>
            <button data-act="newProject" class="btn btn-link"><i data-lucide="folder-plus" class="w-4 h-4"></i> Novo</button>
          </div>
          <div id="projects-body" class="space-y-2"></div>
        </section>

        <section id="view-tasks" class="hidden-view">
          <div class="flex items-end justify-between mb-4">
            <div>
              <h1 class="text-2xl font-semibold tracking-tight">Tarefas</h1>
              <p class="text-sm text-muted" id="tasks-count" aria-live="polite"></p>
            </div>
            <button id="btn-clear-filters" data-act="clearFilters" class="btn btn-link hidden">Limpar filtros</button>
          </div>
          <div class="flex items-center gap-2 mb-3">
            <div class="relative flex-1">
              <i data-lucide="search" class="w-4 h-4 text-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <input type="search" id="f-q" class="search" placeholder="Buscar tarefas" aria-label="Buscar em títulos e descrições" autocomplete="off">
            </div>
            <button id="btn-filters" data-act="openFilters" class="icon-btn" aria-label="Filtros">
              <i data-lucide="sliders-horizontal" class="w-4 h-4"></i><span id="filters-badge" class="badge-count hidden"></span>
            </button>
          </div>
          <div id="status-chips" class="chip-row" role="group" aria-label="Filtrar por status"></div>
          <div id="active-chips" class="flex flex-wrap gap-2 mt-2 hidden"></div>
          <div id="tasks-body" class="space-y-2 mt-4"></div>
        </section>
      </main>
    </div>

    <!-- Detalhes: bottom sheet no mobile, painel ao lado da lista no desktop -->
    <div id="detail-backdrop" class="backdrop" data-act="closeSheet" data-v="detail"></div>
    <aside id="detail-panel" class="sheet" role="dialog" aria-modal="false" aria-label="Detalhes da tarefa" tabindex="-1">
      <div class="grabber" aria-hidden="true"></div>
      <div id="detail-content" class="space-y-4"></div>
    </aside>
  </div>

  <!-- Navegação inferior (mobile) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 border-t border-line" style="background:var(--surface);padding-bottom:env(safe-area-inset-bottom)" aria-label="Navegação principal">
    <div id="bottom-nav-inner" class="grid grid-cols-4 max-w-xl mx-auto"></div>
  </nav>

  <!-- Criação rápida -->
  <div id="create-backdrop" class="backdrop" data-act="closeSheet" data-v="create"></div>
  <div id="create-panel" class="sheet modal" role="dialog" aria-modal="true" aria-labelledby="create-heading" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <h2 id="create-heading" class="sr-only">Nova tarefa</h2>
    <form id="create-form" class="space-y-4" novalidate>
      <div id="c-draft-note" class="hidden flex items-center justify-between text-xs text-muted">
        <span>Rascunho restaurado</span>
        <button type="button" data-act="discardDraft" class="btn-link">Descartar</button>
      </div>
      <input type="text" id="c-title" class="w-full text-base font-semibold bg-transparent focus:outline-none" style="min-height:44px"
             placeholder="O que precisa ser feito?" aria-label="Título da tarefa" autocomplete="off" required>

      <div class="grid grid-cols-2 gap-2 pt-3 border-t border-line">
        <div><label class="label" for="c-date">Data</label>
          <select id="c-date" class="field">
            <option value="today">Hoje</option><option value="tomorrow">Amanhã</option>
            <option value="custom">Escolher data…</option><option value="none">Sem data</option>
          </select></div>
        <div><label class="label" for="c-priority">Prioridade</label>
          <select id="c-priority" class="field">
            <option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option>
          </select></div>
        <div id="c-date-custom-wrap" class="hidden"><label class="label" for="c-date-custom">Data escolhida</label>
          <input type="date" id="c-date-custom" class="field"></div>
        <div class="col-span-2"><label class="label" for="c-project">Projeto</label>
          <select id="c-project" class="field"></select></div>
      </div>

      <div id="c-adv" class="hidden space-y-3 pt-3 border-t border-line">
        <div><label class="label" for="c-desc">Descrição</label>
          <textarea id="c-desc" class="field" rows="2" placeholder="Notas opcionais"></textarea></div>
        <div><label class="label" for="c-subs">Subtarefas (uma por linha)</label>
          <textarea id="c-subs" class="field" rows="2"></textarea></div>
        <div class="grid grid-cols-2 gap-2">
          <div><label class="label" for="c-time">Horário de início</label><input type="time" id="c-time" class="field"></div>
          <div><label class="label" for="c-dur">Duração estimada</label><select id="c-dur" class="field"></select></div>
          <div><label class="label" for="c-due">Prazo de entrega</label><input type="date" id="c-due" class="field"></div>
          <div><label class="label" for="c-rec">Recorrência</label>
            <select id="c-rec" class="field">
              <option value="none">Sem recorrência</option><option value="daily">Diária</option>
              <option value="weekly">Semanal</option><option value="monthly">Mensal</option>
            </select></div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <button type="button" id="c-toggle" data-act="toggleAdv" class="btn-link" aria-expanded="false" aria-controls="c-adv">+ Mais detalhes</button>
        <button type="button" data-act="createAnother" class="btn-link">Criar e adicionar outra</button>
      </div>
      <div class="flex gap-2">
        <button type="button" data-act="closeSheet" data-v="create" class="btn btn-soft">Cancelar</button>
        <button type="submit" id="c-submit" class="btn btn-primary flex-1">Criar tarefa</button>
      </div>
    </form>
  </div>

  <!-- Filtros -->
  <div id="filters-backdrop" class="backdrop" data-act="closeSheet" data-v="filters"></div>
  <div id="filters-panel" class="sheet modal" role="dialog" aria-modal="true" aria-labelledby="filters-heading" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <div class="flex items-center justify-between mb-4">
      <h2 id="filters-heading" class="text-lg font-semibold tracking-tight">Filtros</h2>
      <button data-act="closeSheet" data-v="filters" class="btn btn-ghost" style="min-width:44px;padding:0" aria-label="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div><label class="label" for="f-date">Data</label><select id="f-date" data-filter="date" class="field"></select></div>
      <div><label class="label" for="f-priority">Prioridade</label>
        <select id="f-priority" data-filter="priority" class="field">
          <option value="all">Todas</option><option value="normal">Normal</option><option value="high">Alta</option><option value="urgent">Urgente</option>
        </select></div>
      <div class="col-span-2"><label class="label" for="f-project">Projeto</label><select id="f-project" data-filter="project" class="field"></select></div>
      <div class="col-span-2"><label class="label" for="f-sort">Ordenar por</label>
        <select id="f-sort" data-filter="sort" class="field">
          <option value="date">Data</option><option value="priority">Prioridade</option><option value="created">Criação</option>
        </select></div>
    </div>
    <div class="flex gap-2 mt-5">
      <button data-act="clearFilters" class="btn btn-soft">Limpar</button>
      <button id="filters-done" data-act="closeSheet" data-v="filters" class="btn btn-primary flex-1">Ver tarefas</button>
    </div>
  </div>

  <!-- Configurações -->
  <div id="settings-backdrop" class="backdrop" data-act="closeSheet" data-v="settings"></div>
  <div id="settings-panel" class="sheet modal" role="dialog" aria-modal="true" aria-labelledby="settings-heading" tabindex="-1">
    <div class="grabber" aria-hidden="true"></div>
    <div class="flex items-center justify-between mb-4">
      <h2 id="settings-heading" class="text-lg font-bold tracking-tight">Configurações</h2>
      <button data-act="closeSheet" data-v="settings" class="btn btn-ghost" style="min-width:44px;padding:0" aria-label="Fechar"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="space-y-5">
      <div>
        <span class="label">Tema</span>
        <div id="theme-group" class="grid grid-cols-3 gap-2" role="group" aria-label="Tema"></div>
      </div>
      <div>
        <span class="label">Dados</span>
        <p class="text-xs text-muted mb-2">Suas tarefas ficam salvas somente neste aparelho (navegador). Não há sincronização com outros dispositivos.</p>
        <button data-act="export" class="btn btn-soft w-full"><i data-lucide="download" class="w-4 h-4"></i> Exportar backup (JSON)</button>
      </div>
    </div>
  </div>

  <!-- Aviso breve com desfazer -->
  <div id="toast" role="status" aria-live="polite">
    <span id="toast-message" class="text-sm"></span>
    <button id="toast-undo" data-act="undo" class="hidden">Desfazer</button>
  </div>

  <script>
    // =====================================================================
    // LÓGICA PURA (sem DOM) — testável isoladamente
    // =====================================================================
    // <pure>
    const PRIORITY_RANK = { normal: 0, high: 1, urgent: 2 };
    const pad = n => String(n).padStart(2, '0');
    function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
    function getTodayDateString() { return toDateStr(new Date()); }
    function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
    function addDays(s, n) { const d = parseDate(s); d.setDate(d.getDate() + n); return toDateStr(d); }
    function diffDays(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }
    function addMonths(s, n, anchorDay) {
      const d = parseDate(s);
      const day = anchorDay || d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() + n);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
      return toDateStr(d);
    }
    // Regra de repetição: diária (+1 dia), semanal (+7 dias), mensal (mesmo dia do mês; no fim de mês usa o último dia).
    function nextOccurrenceDate(base, recurrence, anchorDay) {
      if (recurrence === 'daily') return addDays(base, 1);
      if (recurrence === 'weekly') return addDays(base, 7);
      if (recurrence === 'monthly') return addMonths(base, 1, anchorDay);
      return base;
    }
    let idCounter = 0;
    function newId(prefix) { idCounter += 1; return (prefix || 't') + Date.now().toString(36) + idCounter.toString(36) + Math.random().toString(36).slice(2, 5); }

    function normalizeTask(t) {
      const o = Object.assign({}, t);
      o.id = String(o.id);
      o.title = String(o.title || 'Sem título');
      o.description = o.description || '';
      o.plannedDate = o.plannedDate || null;
      o.startTime = o.startTime || '';
      o.duration = Number(o.duration) || 0;
      o.dueDate = o.dueDate || null;
      o.status = ['todo', 'doing', 'completed'].includes(o.status) ? o.status : 'todo';
      o.priority = ['normal', 'high', 'urgent'].includes(o.priority) ? o.priority : 'normal';
      o.projectId = (!o.projectId || o.projectId === 'inbox') ? '' : String(o.projectId);
      o.recurrence = ['daily', 'weekly', 'monthly'].includes(o.recurrence) ? o.recurrence : 'none';
      o.subtasks = Array.isArray(o.subtasks) ? o.subtasks.map(s => ({ id: String(s.id), title: String(s.title || ''), completed: !!s.completed })) : [];
      o.createdAt = Number(o.createdAt) || Number(o.id) || 0;
      o.completedAt = o.completedAt || null;
      return o;
    }
    const isOpen = t => t.status !== 'completed';
    const isOverdue = (t, today) => isOpen(t) && !!t.plannedDate && t.plannedDate < today;

    function matchesFilters(t, f, today) {
      if (f.q) {
        const q = f.q.toLowerCase();
        if (!t.title.toLowerCase().includes(q) && !(t.description || '').toLowerCase().includes(q)) return false;
      }
      if (f.status === 'open' && !isOpen(t)) return false;
      if (['todo', 'doing', 'completed'].includes(f.status) && t.status !== f.status) return false;
      if (f.priority !== 'all' && t.priority !== f.priority) return false;
      if (f.project === 'none' && t.projectId) return false;
      if (f.project !== 'all' && f.project !== 'none' && t.projectId !== f.project) return false;
      if (f.date === 'today' && t.plannedDate !== today) return false;
      if (f.date === 'overdue' && !isOverdue(t, today)) return false;
      if (f.date === 'upcoming' && !(t.plannedDate && t.plannedDate > today)) return false;
      if (f.date === 'none' && t.plannedDate) return false;
      if (/^\d{4}-\d{2}-\d{2}$/.test(f.date) && t.plannedDate !== f.date) return false;
      return true;
    }
    function sortTasks(list, mode) {
      const byDate = (a, b) =>
        (a.plannedDate || '9999-99-99').localeCompare(b.plannedDate || '9999-99-99') ||
        (a.startTime || '99:99').localeCompare(b.startTime || '99:99');
      const byPriority = (a, b) => PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority];
      return list.slice().sort((a, b) => {
        if (mode === 'priority') return byPriority(a, b) || byDate(a, b) || a.createdAt - b.createdAt;
        if (mode === 'created') return b.createdAt - a.createdAt;
        return byDate(a, b) || byPriority(a, b) || a.createdAt - b.createdAt;
      });
    }
    // Próxima tarefa: maior prioridade; depois horários futuros, sem horário, horários já passados.
    function pickNextTask(all, today, nowMin) {
      const toMin = t => t.startTime ? Number(t.startTime.slice(0, 2)) * 60 + Number(t.startTime.slice(3, 5)) : null;
      const group = t => { const m = toMin(t); return m === null ? 1 : (m >= nowMin ? 0 : 2); };
      const c = all.filter(t => isOpen(t) && t.plannedDate === today);
      c.sort((a, b) =>
        PRIORITY_RANK[b.priority] - PRIORITY_RANK[a.priority] ||
        group(a) - group(b) ||
        (toMin(a) ?? 0) - (toMin(b) ?? 0) ||
        a.createdAt - b.createdAt);
      return c[0] || null;
    }
    function weekDays(today) { // domingo..sábado da semana de "today"
      const dow = parseDate(today).getDay();
      const start = addDays(today, -dow);
      return Array.from({ length: 7 }, (_, i) => addDays(start, i));
    }
    // Conclui e, se recorrente, gera a próxima ocorrência sem apagar o histórico.
    function applyComplete(list, id, nowTs, today) {
      const t = list.find(x => x.id === id);
      if (!t) return null;
      const prev = t.status;
      t.status = 'completed';
      t.completedAt = nowTs;
      let generatedId = null;
      if (t.recurrence !== 'none') {
        if (!t.seriesId) t.seriesId = t.id;
        const base = t.plannedDate || today;
        if (!t.anchorDay) t.anchorDay = parseDate(base).getDate();
        const next = nextOccurrenceDate(base, t.recurrence, t.anchorDay);
        const dup = list.some(x => x.seriesId === t.seriesId && x.id !== t.id && x.status !== 'completed' && x.plannedDate === next);
        if (!dup) {
          const copy = normalizeTask(Object.assign({}, t, {
            id: newId(), plannedDate: next, status: 'todo', completedAt: null, createdAt: nowTs,
            dueDate: t.dueDate && t.plannedDate ? addDays(next, diffDays(t.plannedDate, t.dueDate)) : t.dueDate,
            subtasks: t.subtasks.map(s => ({ id: newId('s'), title: s.title, completed: false }))
          }));
          copy.seriesId = t.seriesId; copy.anchorDay = t.anchorDay;
          list.push(copy);
          generatedId = copy.id;
        }
      }
      return { prev, generatedId };
    }
    // </pure>

    // =====================================================================
    // ESTADO E PERSISTÊNCIA
    // =====================================================================
    const KEYS = {
      tasks: 'app_tasks_v4', projects: 'app_projects_v4',
      legacyTasks: 'app_tasks_v3', legacyProjects: 'app_projects_v3',
      draft: 'app_draft_v1', theme: 'app_theme_v1'
    };
    const DEFAULT_PROJECTS = [
      { id: 'p1', name: 'Trabalho', color: '#4F46E5' },
      { id: 'p2', name: 'Pessoal', color: '#10B981' }
    ];
    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const defaultFilters = () => ({ q: '', status: 'open', priority: 'all', project: 'all', date: 'all', sort: 'date' });

    let tasks = [], projects = [];
    let filters = defaultFilters();
    let activeTab = 'home', detailId = null, lastAction = null, toastTimer = null;
    let lastCreate = { sig: '', at: 0 };
    let storageFailed = false, lastRenderDay = getTodayDateString();
    const lastFocus = {};

    function readJSON(key) {
      try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
      catch (e) { return undefined; } // undefined = existe mas está ilegível
    }
    function loadState() {
      let t = readJSON(KEYS.tasks), p = readJSON(KEYS.projects);
      if (t === undefined || p === undefined) { // dados ilegíveis: guarda cópia bruta antes de qualquer gravação
        try {
          ['tasks', 'projects'].forEach(k => {
            const raw = localStorage.getItem(KEYS[k]);
            if (raw) localStorage.setItem(KEYS[k] + '_corrompido_' + Date.now(), raw);
          });
        } catch (e) {}
        t = null; p = null;
      }
      if (!Array.isArray(t)) { // migração segura: lê v3 sem apagá-lo
        const lt = readJSON(KEYS.legacyTasks);
        t = Array.isArray(lt) ? lt : [];
      }
      if (!Array.isArray(p)) {
        const lp = readJSON(KEYS.legacyProjects);
        p = Array.isArray(lp) ? lp : DEFAULT_PROJECTS;
      }
      tasks = t.map(normalizeTask);
      projects = p.map(x => ({ id: String(x.id), name: String(x.name || 'Projeto'), color: x.color || '#4F46E5', description: x.description || '', archived: !!x.archived }));
    }
    function persist() {
      try {
        localStorage.setItem(KEYS.tasks, JSON.stringify(tasks));
        localStorage.setItem(KEYS.projects, JSON.stringify(projects));
        storageFailed = false;
      } catch (e) { storageFailed = true; }
      updateBanner();
      return !storageFailed;
    }
    function save() { persist(); renderAll(); }

    function updateBanner() {
      const b = $('banner');
      let msg = '';
      if (storageFailed) msg = 'Não foi possível salvar neste aparelho. Suas alterações continuam na tela; exporte um backup nas configurações.';
      else if (typeof navigator !== 'undefined' && navigator.onLine === false) msg = 'Sem conexão. O app continua funcionando e os dados ficam salvos neste aparelho.';
      b.textContent = msg;
      b.classList.toggle('hidden', !msg);
    }

    // =====================================================================
    // FORMATAÇÃO
    // =====================================================================
    const fmtDate = s => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
    const fmtDur = m => m >= 60 ? (m % 60 ? `${Math.floor(m / 60)}h${pad(m % 60)}` : `${m / 60}h`) : `${m} min`;
    const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
    const DURATIONS = [0, 15, 30, 45, 60, 90, 120, 180];
    function refreshIcons() { if (window.lucide && lucide.createIcons) lucide.createIcons(); }

    // =====================================================================
    // NAVEGAÇÃO
    // =====================================================================
    const NAV = [
      { id: 'home', label: 'Início', icon: 'layout-dashboard' },
      { id: 'calendar', label: 'Calendário', icon: 'calendar' },
      { id: 'projects', label: 'Projetos', icon: 'folder' },
      { id: 'tasks', label: 'Tarefas', icon: 'list-checks' }
    ];
    function renderNav() {
      const mk = (n, side) => `<button data-act="tab" data-v="${n.id}" class="nav-btn${side ? ' side' : ''}"${activeTab === n.id ? ' aria-current="page"' : ''}><i data-lucide="${n.icon}" class="w-5 h-5"></i><span>${n.label}</span></button>`;
      $('bottom-nav-inner').innerHTML = NAV.map(n => mk(n, false)).join('');
      $('side-nav').innerHTML = NAV.map(n => mk(n, true)).join('');
    }
    function go(tab, noScroll) {
      activeTab = tab;
      NAV.forEach(n => $('view-' + n.id).classList.toggle('hidden-view', n.id !== tab));
      renderNav();
      renderAll();
      if (!noScroll) window.scrollTo(0, 0);
    }
    function goFiltered(patch) {
      filters = Object.assign(defaultFilters(), patch);
      $('f-q').value = filters.q;
      go('tasks');
    }

    // =====================================================================
    // COMPONENTES DE LISTA
    // =====================================================================
    function taskMeta(t) {
      const today = getTodayDateString();
      const proj = projects.find(p => p.id === t.projectId);
      const m = [];
      if (t.priority === 'urgent') m.push('<span class="pill pill-danger"><i data-lucide="alert-triangle" class="w-3 h-3"></i>Urgente</span>');
      else if (t.priority === 'high') m.push('<span class="pill pill-warn"><i data-lucide="arrow-up" class="w-3 h-3"></i>Alta</span>');
      if (t.status === 'doing') m.push('<span class="pill pill-info">Em andamento</span>');
      if (isOverdue(t, today)) m.push('<span class="pill pill-warn"><i data-lucide="alert-circle" class="w-3 h-3"></i>Atrasada</span>');
      if (t.startTime) m.push(`<span class="meta"><i data-lucide="clock" class="w-3 h-3"></i>${esc(t.startTime)}${t.duration ? ' · ' + fmtDur(t.duration) : ''}</span>`);
      if (t.dueDate) m.push(`<span class="meta"><i data-lucide="flag" class="w-3 h-3"></i>Prazo ${fmtDate(t.dueDate)}</span>`);
      if (proj) m.push(`<span class="meta"><span style="width:8px;height:8px;border-radius:99px;background:${esc(proj.color)}" aria-hidden="true"></span>${esc(proj.name)}</span>`);
      if (t.subtasks.length) m.push(`<span class="meta">${t.subtasks.filter(s => s.completed).length}/${t.subtasks.length} subtarefas</span>`);
      if (t.recurrence !== 'none') m.push('<span class="meta" title="Recorrente"><i data-lucide="repeat" class="w-3 h-3"></i><span class="sr-only">Recorrente</span></span>');
      return m;
    }
    function taskRow(t) {
      const done = t.status === 'completed';
      const m = taskMeta(t);
      return `<div class="card task-row">
        <button class="chk${done ? ' done' : ''}" data-act="toggle" data-id="${esc(t.id)}" aria-pressed="${done}" aria-label="${done ? 'Reabrir' : 'Concluir'}: ${esc(t.title)}"><span class="box">${done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}</span></button>
        <button class="flex-1 min-w-0 text-left py-3" data-act="open" data-id="${esc(t.id)}">
          <span class="block text-sm font-medium truncate${done ? ' line-through text-muted' : ''}">${esc(t.title)}</span>
          ${m.length ? `<span class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-1 text-xs text-muted">${m.join('')}</span>` : ''}
        </button>
      </div>`;
    }
    function heroCard(t) {
      const m = taskMeta(t);
      return `<div class="hero">
        <div class="pl-2 mb-1"><span class="pill pill-info"><i data-lucide="target" class="w-3 h-3"></i>Prioridade em foco</span></div>
        <div class="flex items-start">
          <button class="chk" data-act="toggle" data-id="${esc(t.id)}" aria-pressed="false" aria-label="Concluir: ${esc(t.title)}"><span class="box"></span></button>
          <button class="flex-1 min-w-0 text-left py-2" data-act="open" data-id="${esc(t.id)}">
            <span class="block text-lg font-semibold tracking-tight leading-snug">${esc(t.title)}</span>
            ${m.length ? `<span class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-2 text-xs text-muted">${m.join('')}</span>` : ''}
          </button>
        </div>
      </div>`;
    }
    const emptyBox = msg => `<div class="card p-6 text-center text-sm text-muted">${msg}</div>`;

    // =====================================================================
    // INÍCIO (DASHBOARD)
    // =====================================================================
    let lastDayPct = 0;
    function renderHome() {
      const today = getTodayDateString();
      const now = new Date();
      const todays = tasks.filter(t => t.plannedDate === today);
      const doneN = todays.filter(t => t.status === 'completed').length;
      const overdueN = tasks.filter(t => isOverdue(t, today)).length;
      const pct = todays.length ? Math.round(doneN / todays.length * 100) : 0;
      const hr = now.getHours();
      const greet = hr < 12 ? 'Bom dia' : hr < 18 ? 'Boa tarde' : 'Boa noite';
      const dateLabel = cap(now.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }));
      const next = pickNextTask(tasks, today, hr * 60 + now.getMinutes());
      const rest = next ? todays.filter(t => t.id !== next.id) : todays;

      const stat = (v, n, label, icon, color) => `<button data-act="stat" data-v="${v}" class="card stat" aria-label="${label}: ${n}. Abrir lista">
        <i data-lucide="${icon}" class="w-4 h-4 stat-ico" style="color:${color}" aria-hidden="true"></i>
        <span class="block text-2xl font-semibold tracking-tight tabular-nums">${n}</span>
        <span class="block text-xs text-muted">${label}</span></button>`;

      const week = weekDays(today).map(d => {
        const n = tasks.filter(t => t.plannedDate === d && isOpen(t)).length;
        const dt = parseDate(d);
        return `<button data-act="day" data-v="${d}" class="day-cell${d === today ? ' today' : ''}" aria-label="${cap(dt.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }))}: ${n} abertas"${d === today ? ' aria-current="date"' : ''}>
          <span>${dt.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')}</span>
          <span class="num">${dt.getDate()}</span><span class="dot${n ? '' : ' none'}"></span></button>`;
      }).join('');

      const recent = projects.filter(p => !p.archived).map(p => {
        const own = tasks.filter(t => t.projectId === p.id);
        return { p, total: own.length, done: own.filter(t => t.status === 'completed').length, last: own.reduce((a, t) => Math.max(a, t.createdAt), 0) };
      }).sort((a, b) => b.last - a.last).slice(0, 3);

      let nextHtml;
      if (next) nextHtml = heroCard(next);
      else if (todays.length) nextHtml = emptyBox('Tudo concluído por hoje.');
      else nextHtml = `<div class="card p-6 text-center"><p class="text-sm text-muted mb-3">Nenhuma tarefa para hoje.</p>
        <button data-act="new" class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i> Planejar uma tarefa</button></div>`;
      const restHtml = rest.length ? `<section class="space-y-2">
        <h2 class="h-sec">${next ? 'Restante do dia' : 'Hoje'}</h2>
        ${sortTasks(rest, 'date').map(taskRow).join('')}
      </section>` : '';

      $('view-home').innerHTML = `
        <div class="space-y-6">
          <div>
            <p class="text-sm text-muted">${esc(dateLabel)}</p>
            <h1 class="text-2xl font-semibold tracking-tight">${greet}</h1>
            <p class="text-sm text-muted mt-0.5">Aqui está o foco do seu dia</p>
          </div>

          <div>
            <div class="grid grid-cols-3 gap-2">
              ${stat('today', todays.length, 'Hoje', 'sun', 'var(--primary-ink)')}
              ${stat('done', doneN, 'Concluídas', 'circle-check', 'var(--ok-fg)')}
              ${stat('overdue', overdueN, 'Atrasadas', 'circle-alert', overdueN ? 'var(--warn-fg)' : 'var(--muted)')}
            </div>
            ${todays.length ? `<div class="mt-3"><div class="flex justify-between text-xs text-muted mb-1.5"><span>Progresso de hoje</span><span>${doneN} de ${todays.length} concluídas</span></div>
              <div class="progress lg" role="progressbar" aria-valuemin="0" aria-valuemax="${todays.length}" aria-valuenow="${doneN}" aria-label="Tarefas de hoje concluídas"><i id="day-bar" data-w="${pct}" style="width:${lastDayPct}%"></i></div></div>` : ''}
          </div>

          <section class="space-y-2">
            <h2 class="h-sec">Próxima tarefa</h2>
            ${nextHtml}
          </section>

          ${restHtml}

          <section class="space-y-2">
            <h2 class="h-sec">Esta semana</h2>
            <div class="card grid grid-cols-7 p-1">${week}</div>
          </section>

          ${recent.length ? `<section class="space-y-2">
            <h2 class="h-sec">Projetos recentes</h2>
            ${recent.map(r => `<button data-act="project" data-v="${esc(r.p.id)}" class="card w-full p-3 text-left block">
              <span class="flex items-center justify-between gap-2">
                <span class="flex items-center gap-2 min-w-0"><span style="width:8px;height:8px;border-radius:99px;background:${esc(r.p.color)}" aria-hidden="true"></span><span class="text-sm font-medium truncate">${esc(r.p.name)}</span></span>
                <span class="text-xs text-muted">${r.total ? `${r.done} de ${r.total} concluídas` : 'Sem tarefas'}</span>
              </span>
              ${r.total ? `<span class="progress block mt-2"><i style="width:${Math.round(r.done / r.total * 100)}%"></i></span>` : ''}
            </button>`).join('')}
          </section>` : ''}
        </div>`;

      // anima a barra do dia a partir do valor anterior
      const bar = $('day-bar');
      if (bar) requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.width = bar.dataset.w + '%'; }));
      lastDayPct = pct;
    }

    // =====================================================================
    // CALENDÁRIO (Agenda — Mês e Semana na Etapa 3)
    // =====================================================================
    function renderCalendar() {
      const today = getTodayDateString();
      let html = '';
      for (let i = 0; i < 7; i++) {
        const d = addDays(today, i);
        const dayTasks = sortTasks(tasks.filter(t => t.plannedDate === d), 'date');
        const label = cap(parseDate(d).toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' }));
        html += `<section class="space-y-2">
          <div class="flex items-center justify-between">
            <h2 class="h-sec">${esc(label)}${i === 0 ? ' · Hoje' : ''}</h2>
            <button data-act="newOn" data-v="${d}" class="btn btn-ghost" style="min-width:44px;padding:0" aria-label="Nova tarefa em ${esc(label)}"><i data-lucide="plus" class="w-4 h-4"></i></button>
          </div>
          ${dayTasks.length ? dayTasks.map(taskRow).join('') : '<p class="text-xs text-muted px-1">Sem tarefas.</p>'}
        </section>`;
      }
      $('calendar-body').innerHTML = html;
    }

    // =====================================================================
    // PROJETOS
    // =====================================================================
    function renderProjects() {
      const list = projects.filter(p => !p.archived);
      $('projects-body').innerHTML = list.length ? list.map(p => {
        const own = tasks.filter(t => t.projectId === p.id);
        const done = own.filter(t => t.status === 'completed').length;
        const open = own.length - done;
        return `<button data-act="project" data-v="${esc(p.id)}" class="card w-full p-3.5 text-left block">
          <span class="flex items-center justify-between gap-2">
            <span class="flex items-center gap-2.5 min-w-0"><span style="width:10px;height:10px;border-radius:99px;background:${esc(p.color)}" aria-hidden="true"></span><span class="text-sm font-semibold truncate">${esc(p.name)}</span></span>
            <span class="pill pill-info">${open} abertas</span>
          </span>
          ${own.length ? `<span class="block mt-2 text-xs text-muted">${done} de ${own.length} concluídas</span><span class="progress block mt-1"><i style="width:${Math.round(done / own.length * 100)}%"></i></span>` : '<span class="block mt-2 text-xs text-muted">Sem tarefas</span>'}
        </button>`;
      }).join('') : emptyBox('Nenhum projeto ainda.');
    }

    // =====================================================================
    // TAREFAS (lista completa, busca, filtros e ordenação)
    // =====================================================================
    const STATUS_CHIPS = [['open', 'Abertas'], ['all', 'Todas'], ['todo', 'A fazer'], ['doing', 'Em andamento'], ['completed', 'Concluídas']];
    const DATE_LABELS = { today: 'Hoje', overdue: 'Atrasadas', upcoming: 'Próximas', none: 'Sem data' };
    function renderTasks() {
      const today = getTodayDateString();
      const def = defaultFilters();
      const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(l)}</option>`;
      $('f-priority').value = filters.priority;
      $('f-sort').value = filters.sort;
      const dateOpts = [['all', 'Qualquer data'], ['today', 'Hoje'], ['overdue', 'Atrasadas'], ['upcoming', 'Próximas'], ['none', 'Sem data (caixa de entrada)']];
      if (/^\d{4}-\d{2}-\d{2}$/.test(filters.date)) dateOpts.push([filters.date, 'Dia ' + fmtDate(filters.date)]);
      $('f-date').innerHTML = dateOpts.map(([v, l]) => opt(v, l, v === filters.date)).join('');
      $('f-project').innerHTML = opt('all', 'Todos', filters.project === 'all') + opt('none', 'Sem projeto', filters.project === 'none') +
        projects.map(p => opt(p.id, p.name + (p.archived ? ' (arquivado)' : ''), filters.project === p.id)).join('');

      $('status-chips').innerHTML = STATUS_CHIPS.map(([v, l]) =>
        `<button class="chip${filters.status === v ? ' on' : ''}" data-act="setStatus" data-v="${v}" aria-pressed="${filters.status === v}">${l}</button>`).join('');

      const active = [];
      if (filters.date !== def.date) active.push(['date', DATE_LABELS[filters.date] || ('Dia ' + fmtDate(filters.date))]);
      if (filters.priority !== def.priority) active.push(['priority', { normal: 'Normal', high: 'Alta', urgent: 'Urgente' }[filters.priority]]);
      if (filters.project !== def.project) {
        const pr = projects.find(x => x.id === filters.project);
        active.push(['project', filters.project === 'none' ? 'Sem projeto' : (pr ? pr.name : 'Projeto')]);
      }
      if (filters.sort !== def.sort) active.push(['sort', 'Ordem: ' + { priority: 'prioridade', created: 'criação' }[filters.sort]]);
      const ac = $('active-chips');
      ac.innerHTML = active.map(([k, l]) => `<button class="chip on" data-act="clearFilter" data-v="${k}" aria-label="Remover filtro: ${esc(l)}"><span>${esc(l)}</span><i data-lucide="x" class="w-3.5 h-3.5"></i></button>`).join('');
      ac.classList.toggle('hidden', !active.length);
      const badge = $('filters-badge');
      badge.textContent = active.length;
      badge.classList.toggle('hidden', !active.length);
      $('btn-filters').setAttribute('aria-label', active.length ? `Filtros (${active.length} ativos)` : 'Filtros');

      const res = sortTasks(tasks.filter(t => matchesFilters(t, filters, today)), filters.sort);
      $('tasks-count').textContent = `${res.length} tarefa${res.length !== 1 ? 's' : ''}`;
      $('filters-done').textContent = `Ver ${res.length} tarefa${res.length !== 1 ? 's' : ''}`;
      $('btn-clear-filters').classList.toggle('hidden', JSON.stringify(filters) === JSON.stringify(def));
      $('tasks-body').innerHTML = res.length ? res.map(taskRow).join('')
        : emptyBox(tasks.length ? 'Nenhuma tarefa com estes filtros.' : 'Você ainda não tem tarefas. Toque em “Nova” para começar.');
    }

    function renderAll() {
      lastRenderDay = getTodayDateString();
      renderHome(); renderCalendar(); renderProjects(); renderTasks();
      refreshIcons();
    }

    // =====================================================================
    // AÇÕES SOBRE TAREFAS (com desfazer)
    // =====================================================================
    function toast(msg, undoable) {
      $('toast-message').textContent = msg;
      $('toast-undo').classList.toggle('hidden', !undoable);
      $('toast').classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { $('toast').classList.remove('show'); lastAction = null; }, 5000);
    }
    function toggleTask(id) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      if (t.status === 'completed') {
        t.status = 'todo'; t.completedAt = null;
        lastAction = { type: 'reopen', id };
        toast('Tarefa reaberta', true);
      } else {
        const r = applyComplete(tasks, id, Date.now(), getTodayDateString());
        lastAction = { type: 'complete', id, prev: r.prev, generatedId: r.generatedId };
        toast(r.generatedId ? 'Concluída · próxima ocorrência criada' : 'Tarefa concluída', true);
      }
      save();
      if (detailId === id) renderDetail();
    }
    function undo() {
      const a = lastAction;
      if (!a) return;
      if (a.type === 'complete') {
        const t = tasks.find(x => x.id === a.id);
        if (t) { t.status = a.prev; t.completedAt = null; }
        if (a.generatedId) tasks = tasks.filter(x => x.id !== a.generatedId);
      } else if (a.type === 'reopen') {
        const t = tasks.find(x => x.id === a.id);
        if (t) { t.status = 'completed'; t.completedAt = Date.now(); }
      } else if (a.type === 'delete') {
        tasks.splice(Math.min(a.index, tasks.length), 0, a.task);
      }
      lastAction = null;
      $('toast').classList.remove('show');
      save();
      if (detailId) renderDetail();
    }
    function deleteTask(id) {
      const index = tasks.findIndex(t => t.id === id);
      if (index === -1) return;
      lastAction = { type: 'delete', task: tasks[index], index };
      tasks.splice(index, 1);
      closeSheet('detail');
      toast('Tarefa excluída', true);
      save();
    }
    function updateField(id, field, value) {
      const t = tasks.find(x => x.id === id);
      if (!t) return;
      if (field === 'status') {
        if (value === 'completed' && t.status !== 'completed') { toggleTask(id); return; }
        if (value !== 'completed' && t.status === 'completed') t.completedAt = null;
        t.status = value;
      } else if (field === 'title') {
        const v = value.trim();
        if (!v) { renderDetail(); return; }
        t.title = v;
      } else if (field === 'plannedDate' || field === 'dueDate') {
        t[field] = value || null;
      } else if (field === 'duration') {
        t.duration = Number(value) || 0;
      } else if (field === 'projectId') {
        t.projectId = value;
      } else {
        t[field] = value;
      }
      save();
    }

    // Subtarefas
    function addSubtask(id) {
      const input = $('d-sub-input');
      const v = input.value.trim();
      const t = tasks.find(x => x.id === id);
      if (!v || !t) return;
      t.subtasks.push({ id: newId('s'), title: v, completed: false });
      save(); renderDetail();
      $('d-sub-input').focus();
    }
    function toggleSub(id, sid) {
      const t = tasks.find(x => x.id === id); if (!t) return;
      const s = t.subtasks.find(x => x.id === sid); if (s) s.completed = !s.completed;
      save(); renderDetail();
    }
    function deleteSub(id, sid) {
      const t = tasks.find(x => x.id === id); if (!t) return;
      t.subtasks = t.subtasks.filter(x => x.id !== sid);
      save(); renderDetail();
    }

    // =====================================================================
    // PAINÉIS
    // =====================================================================
    const isDesktop = () => window.matchMedia('(min-width: 1024px)').matches;
    function updateScrollLock() {
      const modal = ['create', 'settings', 'filters'].some(n => $(n + '-panel').classList.contains('open'));
      const detail = $('detail-panel').classList.contains('open') && !isDesktop();
      document.body.classList.toggle('lock', modal || detail);
    }
    function openSheet(name) {
      lastFocus[name] = document.activeElement;
      $(name + '-panel').classList.add('open');
      $(name + '-backdrop').classList.add('open');
      updateScrollLock();
    }
    function closeSheet(name) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); // confirma campos pendentes
      $(name + '-panel').classList.remove('open');
      $(name + '-backdrop').classList.remove('open');
      if (name === 'detail') detailId = null;
      updateScrollLock();
      const f = lastFocus[name];
      if (f && document.contains(f) && f.focus) f.focus();
    }

    // ---- Criação rápida ----
    function fillCreateSelects() {
      $('c-project').innerHTML = '<option value="">Sem projeto</option>' +
        projects.filter(p => !p.archived).map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
      $('c-dur').innerHTML = DURATIONS.map(m => `<option value="${m}">${m ? fmtDur(m) : 'Sem duração'}</option>`).join('');
    }
    function syncDateControl() {
      $('c-date-custom-wrap').classList.toggle('hidden', $('c-date').value !== 'custom');
    }
    function setCreateDate(dateStr) {
      const today = getTodayDateString();
      if (!dateStr) $('c-date').value = 'none';
      else if (dateStr === today) $('c-date').value = 'today';
      else if (dateStr === addDays(today, 1)) $('c-date').value = 'tomorrow';
      else { $('c-date').value = 'custom'; $('c-date-custom').value = dateStr; }
      syncDateControl();
    }
    function setAdvanced(open) {
      $('c-adv').classList.toggle('hidden', !open);
      $('c-toggle').textContent = open ? '– Menos detalhes' : '+ Mais detalhes';
      $('c-toggle').setAttribute('aria-expanded', String(open));
    }
    const DRAFT_FIELDS = ['c-title', 'c-date', 'c-date-custom', 'c-priority', 'c-project', 'c-desc', 'c-subs', 'c-time', 'c-dur', 'c-due', 'c-rec'];
    function saveDraft() {
      const d = {};
      DRAFT_FIELDS.forEach(f => d[f] = $(f).value);
      d.adv = !$('c-adv').classList.contains('hidden');
      const meaningful = d['c-title'].trim() || d['c-desc'].trim() || d['c-subs'].trim();
      try { meaningful ? localStorage.setItem(KEYS.draft, JSON.stringify(d)) : localStorage.removeItem(KEYS.draft); } catch (e) {}
    }
    function clearDraft() { try { localStorage.removeItem(KEYS.draft); } catch (e) {} }
    function resetCreateForm() {
      $('create-form').reset();
      $('c-date').value = 'today';
      syncDateControl();
      setAdvanced(false);
      $('c-draft-note').classList.add('hidden');
    }
    function openCreate(prefillDate) {
      fillCreateSelects();
      resetCreateForm();
      const d = readJSON(KEYS.draft);
      if (d && d['c-title'] !== undefined) {
        DRAFT_FIELDS.forEach(f => { if (d[f] !== undefined && f !== 'c-project') $(f).value = d[f]; });
        if (d['c-project'] && projects.some(p => p.id === d['c-project'])) $('c-project').value = d['c-project'];
        syncDateControl(); setAdvanced(!!d.adv);
        $('c-draft-note').classList.remove('hidden');
      }
      if (prefillDate) setCreateDate(prefillDate);
      openSheet('create');
      setTimeout(() => $('c-title').focus(), 60);
    }
    function createFromForm(keepOpen) {
      const title = $('c-title').value.trim();
      if (!title) { $('c-title').focus(); return; }
      let planned = null;
      const dv = $('c-date').value;
      if (dv === 'today') planned = getTodayDateString();
      else if (dv === 'tomorrow') planned = addDays(getTodayDateString(), 1);
      else if (dv === 'custom') planned = $('c-date-custom').value || null;
      const sig = [title, planned, $('c-project').value, $('c-priority').value, $('c-desc').value].join('|');
      if (sig === lastCreate.sig && Date.now() - lastCreate.at < 800) return; // evita duplicação por toques repetidos
      lastCreate = { sig, at: Date.now() };
      const subs = $('c-subs').value.split('\n').map(s => s.trim()).filter(Boolean).map(s => ({ id: newId('s'), title: s, completed: false }));
      tasks.unshift(normalizeTask({
        id: newId(), title, description: $('c-desc').value.trim(), plannedDate: planned,
        startTime: $('c-time').value, duration: $('c-dur').value, dueDate: $('c-due').value || null,
        status: 'todo', priority: $('c-priority').value, projectId: $('c-project').value,
        recurrence: $('c-rec').value, subtasks: subs, createdAt: Date.now()
      }));
      clearDraft();
      const keepDate = $('c-date').value, keepCustom = $('c-date-custom').value, keepProj = $('c-project').value, keepPrio = $('c-priority').value;
      resetCreateForm();
      if (keepOpen) {
        $('c-date').value = keepDate; $('c-date-custom').value = keepCustom; syncDateControl();
        $('c-project').value = keepProj; $('c-priority').value = keepPrio;
        $('c-title').focus();
      } else {
        closeSheet('create');
      }
      lastAction = null;
      toast('Tarefa criada', false);
      save();
    }
    function newProject() {
      const name = (prompt('Nome do novo projeto:') || '').trim();
      if (!name) return;
      projects.push({ id: newId('p'), name, color: '#4F46E5', description: '', archived: false });
      save();
    }

    // ---- Detalhes ----
    function renderDetail() {
      const t = tasks.find(x => x.id === detailId);
      if (!t) { closeSheet('detail'); return; }
      const opt = (v, l, sel) => `<option value="${esc(v)}"${sel ? ' selected' : ''}>${esc(l)}</option>`;
      const durList = DURATIONS.includes(t.duration) ? DURATIONS : DURATIONS.concat(t.duration).sort((a, b) => a - b);
      const fld = (label, inner) => `<div><label class="label">${label}</label>${inner}</div>`;
      const dat = (field, val, type) => `<input type="${type}" class="field" data-field="${field}" data-id="${esc(t.id)}" value="${esc(val || '')}">`;
      const sel = (field, opts) => `<select class="field" data-field="${field}" data-id="${esc(t.id)}">${opts}</select>`;
      $('detail-content').innerHTML = `
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-semibold">Detalhes</h2>
          <div class="flex items-center">
            <button data-act="delete" data-id="${esc(t.id)}" class="btn btn-ghost" style="color:var(--danger-fg)"><i data-lucide="trash-2" class="w-4 h-4"></i> Excluir</button>
            <button data-act="closeSheet" data-v="detail" class="btn btn-ghost" style="min-width:44px;padding:0" aria-label="Fechar detalhes"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
        </div>
        ${fld('Título', `<input type="text" class="field" style="font-weight:600;font-size:1rem" data-field="title" data-id="${esc(t.id)}" value="${esc(t.title)}">`)}
        <div class="grid grid-cols-2 gap-2">
          ${fld('Status', sel('status', opt('todo', 'A fazer', t.status === 'todo') + opt('doing', 'Em andamento', t.status === 'doing') + opt('completed', 'Concluída', t.status === 'completed')))}
          ${fld('Prioridade', sel('priority', opt('normal', 'Normal', t.priority === 'normal') + opt('high', 'Alta', t.priority === 'high') + opt('urgent', 'Urgente', t.priority === 'urgent')))}
          <div class="col-span-2">${fld('Projeto', sel('projectId', opt('', 'Sem projeto', !t.projectId) + projects.map(p => opt(p.id, p.name, p.id === t.projectId)).join('')))}</div>
          ${fld('Data planejada', dat('plannedDate', t.plannedDate, 'date'))}
          ${fld('Prazo de entrega', dat('dueDate', t.dueDate, 'date'))}
          ${fld('Horário de início', dat('startTime', t.startTime, 'time'))}
          ${fld('Duração estimada', sel('duration', durList.map(m => opt(m, m ? fmtDur(m) : 'Sem duração', t.duration === m)).join('')))}
          <div class="col-span-2">${fld('Recorrência', sel('recurrence', opt('none', 'Sem recorrência', t.recurrence === 'none') + opt('daily', 'Diária', t.recurrence === 'daily') + opt('weekly', 'Semanal', t.recurrence === 'weekly') + opt('monthly', 'Mensal', t.recurrence === 'monthly')))}</div>
        </div>
        ${fld('Descrição', `<textarea class="field" rows="3" data-field="description" data-id="${esc(t.id)}" placeholder="Adicionar notas">${esc(t.description)}</textarea>`)}
        <div>
          <span class="label">Subtarefas${t.subtasks.length ? ` (${t.subtasks.filter(s => s.completed).length}/${t.subtasks.length})` : ''}</span>
          <div class="space-y-1 mb-2">
            ${t.subtasks.map(s => `<div class="flex items-center">
              <button class="chk${s.completed ? ' done' : ''}" data-act="toggleSub" data-id="${esc(t.id)}" data-sid="${esc(s.id)}" aria-pressed="${s.completed}" aria-label="${s.completed ? 'Reabrir' : 'Concluir'} subtarefa: ${esc(s.title)}"><span class="box">${s.completed ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}</span></button>
              <span class="flex-1 text-sm${s.completed ? ' line-through text-muted' : ''}">${esc(s.title)}</span>
              <button class="btn btn-ghost" style="min-width:44px;padding:0" data-act="delSub" data-id="${esc(t.id)}" data-sid="${esc(s.id)}" aria-label="Remover subtarefa: ${esc(s.title)}"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>`).join('')}
          </div>
          <div class="flex gap-2">
            <input type="text" id="d-sub-input" class="field" placeholder="Nova subtarefa" aria-label="Nova subtarefa" data-sub-for="${esc(t.id)}" autocomplete="off">
            <button class="btn btn-soft" data-act="addSub" data-id="${esc(t.id)}">Adicionar</button>
          </div>
        </div>`;
      refreshIcons();
    }
    function openDetail(id) {
      detailId = id;
      renderDetail();
      openSheet('detail');
      setTimeout(() => $('detail-panel').focus(), 60);
    }

    // ---- Configurações ----
    function applyTheme(mode) {
      if (mode === 'light' || mode === 'dark') document.documentElement.dataset.theme = mode;
      else delete document.documentElement.dataset.theme;
    }
    function currentTheme() { try { return localStorage.getItem(KEYS.theme) || 'auto'; } catch (e) { return 'auto'; } }
    function renderTheme() {
      const cur = currentTheme();
      $('theme-group').innerHTML = [['auto', 'Automático'], ['light', 'Claro'], ['dark', 'Escuro']].map(([v, l]) =>
        `<button data-act="theme" data-v="${v}" class="btn ${cur === v ? 'btn-primary' : 'btn-soft'}" aria-pressed="${cur === v}">${l}</button>`).join('');
    }
    function exportBackup() {
      const blob = new Blob([JSON.stringify({ versao: 4, exportadoEm: new Date().toISOString(), tarefas: tasks, projetos: projects }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tarefas-backup-${getTodayDateString()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    // =====================================================================
    // EVENTOS (delegação)
    // =====================================================================
    const actions = {
      tab: (id, v) => go(v),
      new: () => openCreate(),
      newOn: (id, v) => openCreate(v),
      toggle: id => toggleTask(id),
      open: id => openDetail(id),
      stat: (id, v) => {
        if (v === 'today') goFiltered({ status: 'all', date: 'today' });
        else if (v === 'done') goFiltered({ status: 'completed', date: 'today' });
        else goFiltered({ status: 'open', date: 'overdue' });
      },
      day: (id, v) => goFiltered({ status: 'all', date: v }),
      project: (id, v) => goFiltered({ status: 'all', project: v }),
      clearFilters: () => goFiltered({}),
      setStatus: (id, v) => { filters.status = v; renderTasks(); refreshIcons(); },
      clearFilter: (id, v) => { filters[v] = defaultFilters()[v]; renderTasks(); refreshIcons(); },
      openFilters: () => { openSheet('filters'); setTimeout(() => $('filters-panel').focus(), 60); },
      settings: () => { renderTheme(); refreshIcons(); openSheet('settings'); setTimeout(() => $('settings-panel').focus(), 60); },
      closeSheet: (id, v) => closeSheet(v),
      toggleAdv: () => { setAdvanced($('c-adv').classList.contains('hidden')); saveDraft(); },
      createAnother: () => createFromForm(true),
      discardDraft: () => { clearDraft(); resetCreateForm(); $('c-title').focus(); },
      delete: id => deleteTask(id),
      addSub: id => addSubtask(id),
      toggleSub: (id, v, el) => toggleSub(id, el.dataset.sid),
      delSub: (id, v, el) => deleteSub(id, el.dataset.sid),
      undo: () => undo(),
      newProject: () => newProject(),
      export: () => exportBackup(),
      theme: (id, v) => { try { localStorage.setItem(KEYS.theme, v); } catch (e) {} applyTheme(v); renderTheme(); }
    };
    document.addEventListener('click', e => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const fn = actions[el.dataset.act];
      if (fn) fn(el.dataset.id, el.dataset.v, el, e);
    });
    document.addEventListener('change', e => {
      const el = e.target;
      if (el.dataset.filter) {
        filters[el.dataset.filter] = el.value;
        renderTasks(); refreshIcons();
      } else if (el.dataset.field) {
        updateField(el.dataset.id, el.dataset.field, el.value);
      }
    });
    $('f-q').addEventListener('input', e => { filters.q = e.target.value.trim(); renderTasks(); refreshIcons(); });
    $('create-form').addEventListener('submit', e => { e.preventDefault(); createFromForm(false); });
    $('create-form').addEventListener('input', saveDraft);
    $('create-form').addEventListener('change', () => { syncDateControl(); saveDraft(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.target.id === 'd-sub-input') { e.preventDefault(); addSubtask(e.target.dataset.subFor); }
      if (e.key === 'Escape') {
        if ($('create-panel').classList.contains('open')) closeSheet('create');
        else if ($('filters-panel').classList.contains('open')) closeSheet('filters');
        else if ($('settings-panel').classList.contains('open')) closeSheet('settings');
        else if ($('detail-panel').classList.contains('open')) closeSheet('detail');
      }
    });
    window.addEventListener('online', updateBanner);
    window.addEventListener('offline', updateBanner);
    window.addEventListener('resize', updateScrollLock);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && getTodayDateString() !== lastRenderDay) renderAll();
    });

    // =====================================================================
    // INICIALIZAÇÃO
    // =====================================================================
    applyTheme(currentTheme());
    loadState();
    persist();
    go('home', true);
  </script>
  <script>
    // Registra o service worker (uso offline e instalação). Falhas não afetam o app.
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
    }
  </script>
</body>
</html>
