<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tarefas | Gestor Minimalista</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            app: {
              bg: '#F8FAFC',
              card: '#FFFFFF',
              primary: '#4F46E5',
              primaryHover: '#4338CA',
              text: '#0F172A',
              muted: '#475569',
              border: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target {
      min-height: 48px;
      min-width: 48px;
    }
    .sheet-transition {
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased select-none pb-24">

  <!-- Top Bar -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur-md border-b border-app-border px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-app-primary flex items-center justify-center text-white font-bold text-sm shadow-sm">
          T
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-app-text">Minhas Tarefas</h1>
          <p class="text-[11px] text-app-muted" id="header-date">Hoje</p>
        </div>
      </div>
      <button onclick="openQuickCreateSheet()" class="touch-target px-3 py-1.5 bg-app-primary hover:bg-app-primaryHover text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition active:scale-95 shadow-sm">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>Nova</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 pt-5">

    <!-- View: Hoje -->
    <section id="view-today" class="space-y-5">
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-app-text">Hoje</h2>
          <p class="text-xs text-app-muted" id="today-stats">0 tarefas pendentes</p>
        </div>
        <span id="completion-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-app-muted border border-app-border">
          0% concluído
        </span>
      </div>

      <!-- Caixa de Entrada -->
      <div onclick="filterInboxView()" class="bg-white border border-app-border rounded-2xl p-4 flex items-center justify-between active:bg-slate-50 transition cursor-pointer shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 text-app-primary flex items-center justify-center">
            <i data-lucide="inbox" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-app-text">Caixa de Entrada</h3>
            <p class="text-xs text-app-muted">Tarefas sem data definida</p>
          </div>
        </div>
        <span id="inbox-count" class="text-xs font-bold text-app-muted bg-slate-100 px-2.5 py-1 rounded-full">0</span>
      </div>

      <!-- Atrasadas -->
      <div id="overdue-wrapper" class="hidden">
        <button onclick="toggleOverdue()" class="w-full flex items-center justify-between text-xs font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 rounded-xl px-3.5 py-2.5">
          <span class="flex items-center gap-1.5">
            <i data-lucide="alert-circle" class="w-4 h-4"></i>
            <span id="overdue-label">Atrasadas (0)</span>
          </span>
          <i data-lucide="chevron-down" id="overdue-icon" class="w-4 h-4 transition-transform duration-200"></i>
        </button>
        <div id="overdue-list" class="mt-2 space-y-2 hidden"></div>
      </div>

      <!-- Lista Hoje -->
      <div class="space-y-2">
        <h4 class="text-xs font-semibold uppercase tracking-wider text-app-muted px-1">Planejadas para hoje</h4>
        <div id="today-task-list" class="space-y-2"></div>
      </div>
    </section>

    <!-- View: Planejar -->
    <section id="view-plan" class="hidden space-y-5">
      <div>
        <h2 class="text-xl font-bold tracking-tight text-app-text">Planejar</h2>
        <p class="text-xs text-app-muted">Próximos dias e organização semanal</p>
      </div>
      <div id="plan-groups" class="space-y-4"></div>
    </section>

    <!-- View: Projetos -->
    <section id="view-projects" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-app-text">Projetos</h2>
          <p class="text-xs text-app-muted">Organize por objetivos</p>
        </div>
        <button onclick="promptNewProject()" class="text-xs font-semibold text-app-primary flex items-center gap-1 px-2.5 py-1.5 rounded-lg hover:bg-indigo-50">
          <i data-lucide="folder-plus" class="w-4 h-4"></i> Novo
        </button>
      </div>
      <div id="projects-list" class="space-y-2"></div>
    </section>

    <!-- View: Buscar -->
    <section id="view-search" class="hidden space-y-4">
      <div>
        <h2 class="text-xl font-bold tracking-tight text-app-text">Buscar</h2>
        <p class="text-xs text-app-muted">Pesquise por título ou descrição</p>
      </div>
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-app-muted absolute left-3.5 top-1/2 -translate-y-1/2"></i>
        <input 
          type="text" 
          id="search-input" 
          oninput="handleSearch()" 
          placeholder="Pesquisar tarefas..." 
          class="w-full bg-white border border-app-border text-sm text-app-text rounded-xl pl-10 pr-4 py-2.5 focus:outline-none focus:border-app-primary"
        >
      </div>
      <div id="search-results" class="space-y-2"></div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-app-border">
    <div class="max-w-xl mx-auto px-2 h-16 grid grid-cols-4 items-center">
      <button onclick="switchTab('today')" id="tab-today" class="flex flex-col items-center justify-center gap-1 py-1 text-app-primary transition">
        <i data-lucide="calendar-check" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Hoje</span>
      </button>

      <button onclick="switchTab('plan')" id="tab-plan" class="flex flex-col items-center justify-center gap-1 py-1 text-app-muted transition">
        <i data-lucide="calendar-range" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Planejar</span>
      </button>

      <button onclick="switchTab('projects')" id="tab-projects" class="flex flex-col items-center justify-center gap-1 py-1 text-app-muted transition">
        <i data-lucide="folder" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Projetos</span>
      </button>

      <button onclick="switchTab('search')" id="tab-search" class="flex flex-col items-center justify-center gap-1 py-1 text-app-muted transition">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span class="text-[11px] font-medium">Buscar</span>
      </button>
    </div>
  </nav>

  <!-- Sheet: Criação Rápida / Detalhada -->
  <div id="create-backdrop" onclick="closeQuickCreateSheet()" class="fixed inset-0 bg-slate-900/40 z-40 hidden opacity-0 transition-opacity"></div>
  <div id="create-panel" class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white rounded-t-3xl border-t border-app-border p-5 z-50 transform translate-y-full sheet-transition shadow-2xl max-h-[85vh] overflow-y-auto">
    <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
    <form id="create-form" onsubmit="handleCreateTask(event)" class="space-y-4">
      <input 
        type="text" 
        id="create-title" 
        placeholder="O que precisa ser feito?" 
        class="w-full text-base font-semibold text-app-text bg-transparent placeholder:text-slate-400 focus:outline-none"
        required
      >

      <div class="flex flex-wrap gap-2 pt-1 border-t border-app-border text-xs">
        <select id="create-date" class="bg-slate-100 text-app-muted px-2.5 py-1.5 rounded-lg border-0 focus:ring-1 focus:ring-app-primary">
          <option value="today">Hoje</option>
          <option value="tomorrow">Amanhã</option>
          <option value="inbox">Sem data</option>
        </select>

        <select id="create-priority" class="bg-slate-100 text-app-muted px-2.5 py-1.5 rounded-lg border-0 focus:ring-1 focus:ring-app-primary">
          <option value="normal">Prioridade Normal</option>
          <option value="high">Prioridade Alta</option>
          <option value="urgent">Urgente</option>
        </select>

        <select id="create-project" class="bg-slate-100 text-app-muted px-2.5 py-1.5 rounded-lg border-0 focus:ring-1 focus:ring-app-primary"></select>
      </div>

      <!-- Detalhes Expansíveis -->
      <div id="create-advanced-section" class="hidden space-y-3 pt-2 border-t border-app-border text-xs">
        <textarea id="create-desc" placeholder="Adicionar descrição ou notas..." class="w-full bg-slate-50 border border-app-border rounded-xl p-2.5 text-xs text-app-text focus:outline-none focus:border-app-primary" rows="2"></textarea>
        
        <div class="flex gap-2">
          <div class="flex-1">
            <label class="block text-[11px] text-app-muted mb-1">Recorrência</label>
            <select id="create-recurrence" class="w-full bg-slate-100 text-app-muted p-2 rounded-lg border-0 text-xs">
              <option value="none">Sem recorrência</option>
              <option value="daily">Diária</option>
              <option value="weekly">Semanal</option>
              <option value="monthly">Mensal</option>
            </select>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between pt-2">
        <button type="button" onclick="toggleCreateAdvanced()" id="btn-toggle-advanced" class="text-xs font-semibold text-app-primary px-1 py-1">
          + Mais detalhes
        </button>
        <div class="flex gap-2">
          <button type="button" onclick="closeQuickCreateSheet()" class="text-xs font-semibold text-app-muted px-3 py-2 rounded-lg hover:bg-slate-100">
            Cancelar
          </button>
          <button type="submit" class="bg-app-primary hover:bg-app-primaryHover text-white text-xs font-semibold px-4 py-2.5 rounded-xl transition shadow-sm">
            Criar tarefa
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Sheet: Detalhes & Edição de Tarefa -->
  <div id="detail-backdrop" onclick="closeDetailSheet()" class="fixed inset-0 bg-slate-900/40 z-40 hidden opacity-0 transition-opacity"></div>
  <div id="detail-panel" class="fixed bottom-0 left-0 right-0 max-w-xl mx-auto bg-white rounded-t-3xl border-t border-app-border p-5 z-50 transform translate-y-full sheet-transition shadow-2xl max-h-[88vh] overflow-y-auto">
    <div class="w-10 h-1 bg-slate-300 rounded-full mx-auto mb-4"></div>
    <div id="detail-content" class="space-y-4"></div>
  </div>

  <!-- Toast: Desfazer -->
  <div id="toast-undo" class="fixed bottom-20 left-4 right-4 max-w-sm mx-auto bg-slate-900 text-white rounded-2xl px-4 py-3 flex items-center justify-between shadow-lg z-50 transform translate-y-28 opacity-0 transition-all duration-200 pointer-events-none">
    <span id="toast-message" class="text-xs">Tarefa concluída</span>
    <button onclick="triggerUndo()" class="text-xs font-bold text-indigo-300 hover:text-indigo-200 pointer-events-auto px-2 py-1">
      Desfazer
    </button>
  </div>

  <!-- JavaScript -->
  <script>
    let tasks = JSON.parse(localStorage.getItem('app_tasks_v3')) || [
      { id: '1', title: 'Revisar orçamento mensal', description: 'Conferir extratos e limites operacionais', plannedDate: getTodayDateString(), status: 'todo', priority: 'high', projectId: 'p1', recurrence: 'monthly', subtasks: [{ id: 's1', title: 'Planilhar despesas', completed: true }] },
      { id: '2', title: 'Definir prioridades da semana', description: '', plannedDate: getTodayDateString(), status: 'completed', priority: 'normal', projectId: 'inbox', recurrence: 'none', subtasks: [] }
    ];

    let projects = JSON.parse(localStorage.getItem('app_projects_v3')) || [
      { id: 'p1', name: 'Trabalho', color: '#4F46E5' },
      { id: 'p2', name: 'Pessoal', color: '#10B981' }
    ];

    let lastAction = null;
    let toastTimeout = null;
    let activeTab = 'today';
    let overdueExpanded = false;
    let currentDetailId = null;

    function getTodayDateString() {
      return new Date().toISOString().split('T')[0];
    }

    function saveState() {
      localStorage.setItem('app_tasks_v3', JSON.stringify(tasks));
      localStorage.setItem('app_projects_v3', JSON.stringify(projects));
      render();
    }

    function switchTab(tab) {
      activeTab = tab;
      ['today', 'plan', 'projects', 'search'].forEach(t => {
        const view = document.getElementById(`view-${t}`);
        const tabBtn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          view.classList.remove('hidden');
          tabBtn.className = 'flex flex-col items-center justify-center gap-1 py-1 text-app-primary transition';
        } else {
          view.classList.add('hidden');
          tabBtn.className = 'flex flex-col items-center justify-center gap-1 py-1 text-app-muted transition';
        }
      });
      lucide.createIcons();
    }

    function filterInboxView() {
      switchTab('plan');
    }

    // Alternar conclusão com suporte a recorrência e Desfazer
    function toggleComplete(id, event) {
      if (event) event.stopPropagation();
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;

      const t = tasks[idx];
      const prevStatus = t.status;
      const isFinishing = prevStatus !== 'completed';

      t.status = isFinishing ? 'completed' : 'todo';

      // Trata recorrência se concluída
      if (isFinishing && t.recurrence && t.recurrence !== 'none') {
        const nextDate = calculateNextOccurrence(t.plannedDate || getTodayDateString(), t.recurrence);
        tasks.push({
          ...t,
          id: String(Date.now()),
          plannedDate: nextDate,
          status: 'todo',
          subtasks: t.subtasks.map(s => ({ ...s, completed: false }))
        });
      }

      lastAction = { type: 'complete', id, prevStatus };
      showUndoToast('Status atualizado');
      saveState();
    }

    function calculateNextOccurrence(baseDateStr, recurrence) {
      const d = new Date(baseDateStr + 'T00:00:00');
      if (recurrence === 'daily') d.setDate(d.getDate() + 1);
      else if (recurrence === 'weekly') d.setDate(d.getDate() + 7);
      else if (recurrence === 'monthly') d.setMonth(d.getMonth() + 1);
      return d.toISOString().split('T')[0];
    }

    function showUndoToast(msg) {
      const toast = document.getElementById('toast-undo');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('translate-y-28', 'opacity-0', 'pointer-events-none');
      clearTimeout(toastTimeout);

      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-28', 'opacity-0', 'pointer-events-none');
        lastAction = null;
      }, 5000);
    }

    function triggerUndo() {
      if (lastAction && lastAction.type === 'complete') {
        const task = tasks.find(t => t.id === lastAction.id);
        if (task) task.status = lastAction.prevStatus;
      } else if (lastAction && lastAction.type === 'delete') {
        tasks.push(lastAction.task);
      }
      document.getElementById('toast-undo').classList.add('translate-y-28', 'opacity-0', 'pointer-events-none');
      saveState();
    }

    function deleteTask(id, event) {
      if (event) event.stopPropagation();
      const task = tasks.find(t => t.id === id);
      if (task) {
        lastAction = { type: 'delete', task: { ...task } };
        tasks = tasks.filter(t => t.id !== id);
        showUndoToast('Tarefa excluída');
        closeDetailSheet();
        saveState();
      }
    }

    // Criação Rápida / Detalhes
    function openQuickCreateSheet() {
      const backdrop = document.getElementById('create-backdrop');
      const panel = document.getElementById('create-panel');
      const projSelect = document.getElementById('create-project');

      projSelect.innerHTML = '<option value="inbox">Caixa de Entrada</option>';
      projects.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.name;
        projSelect.appendChild(opt);
      });

      backdrop.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('translate-y-full');
        document.getElementById('create-title').focus();
      }, 10);
    }

    function closeQuickCreateSheet() {
      const backdrop = document.getElementById('create-backdrop');
      const panel = document.getElementById('create-panel');
      backdrop.classList.add('opacity-0');
      panel.classList.add('translate-y-full');
      setTimeout(() => backdrop.classList.add('hidden'), 220);
      document.getElementById('create-form').reset();
      document.getElementById('create-advanced-section').classList.add('hidden');
      document.getElementById('btn-toggle-advanced').textContent = '+ Mais detalhes';
    }

    function toggleCreateAdvanced() {
      const adv = document.getElementById('create-advanced-section');
      const btn = document.getElementById('btn-toggle-advanced');
      if (adv.classList.contains('hidden')) {
        adv.classList.remove('hidden');
        btn.textContent = '- Menos detalhes';
      } else {
        adv.classList.add('hidden');
        btn.textContent = '+ Mais detalhes';
      }
    }

    function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('create-title').value.trim();
      const dateVal = document.getElementById('create-date').value;
      const priority = document.getElementById('create-priority').value;
      const project = document.getElementById('create-project').value;
      const desc = document.getElementById('create-desc').value.trim();
      const recurrence = document.getElementById('create-recurrence').value;

      let planned = null;
      if (dateVal === 'today') {
        planned = getTodayDateString();
      } else if (dateVal === 'tomorrow') {
        const tm = new Date();
        tm.setDate(tm.getDate() + 1);
        planned = tm.toISOString().split('T')[0];
      }

      tasks.unshift({
        id: String(Date.now()),
        title,
        description: desc,
        plannedDate: planned,
        status: 'todo',
        priority,
        projectId: project,
        recurrence: recurrence || 'none',
        subtasks: []
      });

      closeQuickCreateSheet();
      saveState();
    }

    // Painel de Detalhes da Tarefa
    function openDetailSheet(id) {
      currentDetailId = id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const container = document.getElementById('detail-content');
      const p = projects.find(pr => pr.id === task.projectId);
      const projName = p ? p.name : 'Caixa de Entrada';

      container.innerHTML = `
        <div class="flex items-center justify-between border-b border-app-border pb-3">
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${task.status === 'completed' ? 'bg-emerald-50 text-emerald-600' : 'bg-indigo-50 text-app-primary'}">
            ${task.status === 'completed' ? 'Concluída' : 'A fazer'}
          </span>
          <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-500 text-xs flex items-center gap-1">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Excluir
          </button>
        </div>

        <div>
          <label class="block text-[11px] text-app-muted uppercase font-bold mb-1">Título</label>
          <input type="text" id="edit-task-title" value="${task.title}" onchange="updateTaskField('${task.id}', 'title', this.value)" class="w-full text-base font-semibold text-app-text bg-slate-50 border border-app-border rounded-xl p-2.5 focus:outline-none focus:border-app-primary">
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="block text-[11px] text-app-muted mb-1">Prioridade</label>
            <select onchange="updateTaskField('${task.id}', 'priority', this.value)" class="w-full bg-slate-50 border border-app-border rounded-xl p-2 text-app-text">
              <option value="normal" ${task.priority === 'normal' ? 'selected' : ''}>Normal</option>
              <option value="high" ${task.priority === 'high' ? 'selected' : ''}>Alta</option>
              <option value="urgent" ${task.priority === 'urgent' ? 'selected' : ''}>Urgente</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-app-muted mb-1">Data Planejada</label>
            <input type="date" value="${task.plannedDate || ''}" onchange="updateTaskField('${task.id}', 'plannedDate', this.value)" class="w-full bg-slate-50 border border-app-border rounded-xl p-2 text-app-text">
          </div>
        </div>

        <div>
          <label class="block text-[11px] text-app-muted uppercase font-bold mb-1">Descrição</label>
          <textarea onchange="updateTaskField('${task.id}', 'description', this.value)" placeholder="Adicionar notas..." class="w-full bg-slate-50 border border-app-border rounded-xl p-2.5 text-xs text-app-text focus:outline-none focus:border-app-primary" rows="2">${task.description || ''}</textarea>
        </div>

        <!-- Subtarefas -->
        <div>
          <label class="block text-[11px] text-app-muted uppercase font-bold mb-2">Subtarefas</label>
          <div id="subtask-list" class="space-y-1.5 mb-2">
            ${(task.subtasks || []).map(st => `
              <div class="flex items-center justify-between text-xs bg-slate-50 border border-app-border rounded-lg p-2">
                <label class="flex items-center gap-2 cursor-pointer flex-1">
                  <input type="checkbox" ${st.completed ? 'checked' : ''} onchange="toggleSubtask('${task.id}', '${st.id}')" class="rounded text-app-primary">
                  <span class="${st.completed ? 'line-through text-slate-400' : 'text-app-text'}">${st.title}</span>
                </label>
                <button onclick="deleteSubtask('${task.id}', '${st.id}')" class="text-slate-400 hover:text-rose-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
              </div>
            `).join('')}
          </div>
          <div class="flex gap-2">
            <input type="text" id="new-subtask-input" placeholder="Nova subtarefa..." class="flex-1 bg-slate-50 border border-app-border rounded-lg px-2.5 py-1.5 text-xs text-app-text focus:outline-none">
            <button onclick="addSubtask('${task.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-app-text rounded-lg text-xs font-semibold">Adicionar</button>
          </div>
        </div>

        <button onclick="closeDetailSheet()" class="w-full py-2.5 bg-app-primary text-white rounded-xl text-xs font-semibold mt-2">Concluir edição</button>
      `;

      const backdrop = document.getElementById('detail-backdrop');
      const panel = document.getElementById('detail-panel');
      backdrop.classList.remove('hidden');
      setTimeout(() => {
        backdrop.classList.remove('opacity-0');
        panel.classList.remove('translate-y-full');
      }, 10);
      lucide.createIcons();
    }

    function closeDetailSheet() {
      const backdrop = document.getElementById('detail-backdrop');
      const panel = document.getElementById('detail-panel');
      backdrop.classList.add('opacity-0');
      panel.classList.add('translate-y-full');
      setTimeout(() => backdrop.classList.add('hidden'), 220);
      currentDetailId = null;
    }

    function updateTaskField(id, field, val) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task[field] = val;
        saveState();
      }
    }

    function addSubtask(taskId) {
      const input = document.getElementById('new-subtask-input');
      const val = input.value.trim();
      if (!val) return;
      const task = tasks.find(t => t.id === taskId);
      if (task) {
        if (!task.subtasks) task.subtasks = [];
        task.subtasks.push({ id: 'st_' + Date.now(), title: val, completed: false });
        input.value = '';
        saveState();
        openDetailSheet(taskId);
      }
    }

    function toggleSubtask(taskId, subtaskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task && task.subtasks) {
        const st = task.subtasks.find(s => s.id === subtaskId);
        if (st) st.completed = !st.completed;
        saveState();
        openDetailSheet(taskId);
      }
    }

    function deleteSubtask(taskId, subtaskId) {
      const task = tasks.find(t => t.id === taskId);
      if (task && task.subtasks) {
        task.subtasks = task.subtasks.filter(s => s.id !== subtaskId);
        saveState();
        openDetailSheet(taskId);
      }
    }

    function toggleOverdue() {
      overdueExpanded = !overdueExpanded;
      const list = document.getElementById('overdue-list');
      const icon = document.getElementById('overdue-icon');
      if (overdueExpanded) {
        list.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        list.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    function promptNewProject() {
      const name = prompt('Nome do novo projeto:');
      if (name && name.trim()) {
        projects.push({ id: 'p_' + Date.now(), name: name.trim(), color: '#4F46E5' });
        saveState();
      }
    }

    function handleSearch() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      const div = document.getElementById('search-results');
      div.innerHTML = '';

      if (!q) {
        div.innerHTML = '<p class="text-xs text-app-muted text-center py-6">Digite algo para pesquisar.</p>';
        return;
      }

      const res = tasks.filter(t => t.title.toLowerCase().includes(q) || (t.description && t.description.toLowerCase().includes(q)));
      if (!res.length) {
        div.innerHTML = '<p class="text-xs text-app-muted text-center py-6">Nenhum resultado para esta busca.</p>';
        return;
      }

      res.forEach(t => div.appendChild(createTaskElement(t)));
      lucide.createIcons();
    }

    function createTaskElement(task) {
      const div = document.createElement('div');
      div.className = 'bg-white border border-app-border rounded-xl p-3.5 flex items-center justify-between gap-3 shadow-sm cursor-pointer hover:border-slate-300 transition';
      div.onclick = () => openDetailSheet(task.id);

      const isCompleted = task.status === 'completed';
      let badge = '';
      if (task.priority === 'urgent') badge = '<span class="text-[10px] font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded-full">Urgente</span>';
      else if (task.priority === 'high') badge = '<span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">Alta</span>';

      const p = projects.find(pr => pr.id === task.projectId);
      const projLabel = p ? p.name : 'Caixa de entrada';

      const subtaskCount = task.subtasks && task.subtasks.length ? `• ${task.subtasks.filter(s => s.completed).length}/${task.subtasks.length}` : '';

      div.innerHTML = `
        <div class="flex items-center gap-3 min-w-0 flex-1">
          <button onclick="toggleComplete('${task.id}', event)" class="touch-target w-6 h-6 rounded-lg border flex items-center justify-center transition ${isCompleted ? 'bg-app-primary border-app-primary text-white' : 'border-slate-300 hover:border-app-primary'}">
            ${isCompleted ? '<i data-lucide="check" class="w-4 h-4 stroke-[3]"></i>' : ''}
          </button>
          <div class="min-w-0 flex-1">
            <p class="text-sm font-medium truncate ${isCompleted ? 'line-through text-slate-400' : 'text-app-text'}">${task.title}</p>
            <div class="flex items-center gap-1.5 mt-0.5 text-[11px] text-app-muted">
              ${badge}
              <span>${projLabel}</span>
              ${subtaskCount ? `<span>${subtaskCount}</span>` : ''}
            </div>
          </div>
        </div>
        <button onclick="deleteTask('${task.id}', event)" class="touch-target text-slate-400 hover:text-rose-500 p-1 flex items-center justify-center">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      `;
      return div;
    }

    function render() {
      const today = getTodayDateString();
      const opts = { weekday: 'short', day: 'numeric', month: 'short' };
      document.getElementById('header-date').textContent = new Date().toLocaleDateString('pt-BR', opts);

      // Caixa de entrada
      const inboxTasks = tasks.filter(t => !t.plannedDate && t.status !== 'completed');
      document.getElementById('inbox-count').textContent = inboxTasks.length;

      // Hoje e Atrasadas
      const todayTasks = tasks.filter(t => t.plannedDate === today);
      const overdueTasks = tasks.filter(t => t.plannedDate && t.plannedDate < today && t.status !== 'completed');

      const completedCount = todayTasks.filter(t => t.status === 'completed').length;
      const pendingCount = todayTasks.filter(t => t.status !== 'completed').length;
      const rate = todayTasks.length > 0 ? Math.round((completedCount / todayTasks.length) * 100) : 0;

      document.getElementById('today-stats').textContent = `${pendingCount} pendente${pendingCount !== 1 ? 's' : ''}`;
      document.getElementById('completion-badge').textContent = `${rate}% concluído`;

      // Render Atrasadas
      const overdueWrapper = document.getElementById('overdue-wrapper');
      const overdueList = document.getElementById('overdue-list');
      if (overdueTasks.length > 0) {
        overdueWrapper.classList.remove('hidden');
        document.getElementById('overdue-label').textContent = `Atrasadas (${overdueTasks.length})`;
        overdueList.innerHTML = '';
        overdueTasks.forEach(t => overdueList.appendChild(createTaskElement(t)));
      } else {
        overdueWrapper.classList.add('hidden');
      }

      // Render Hoje
      const todayList = document.getElementById('today-task-list');
      todayList.innerHTML = '';
      if (!todayTasks.length) {
        todayList.innerHTML = '<div class="bg-white border border-app-border rounded-2xl p-8 text-center text-xs text-app-muted">Nenhuma tarefa planejada para hoje.</div>';
      } else {
        todayTasks.forEach(t => todayList.appendChild(createTaskElement(t)));
      }

      // Render Planejar (Próximos 7 dias)
      const planGroups = document.getElementById('plan-groups');
      planGroups.innerHTML = '';

      // Bloco Sem Data
      const noDateGroup = document.createElement('div');
      noDateGroup.className = 'space-y-2';
      noDateGroup.innerHTML = '<h3 class="text-xs font-bold text-app-muted uppercase tracking-wider">Sem data (Caixa de entrada)</h3>';
      const noDateTasks = tasks.filter(t => !t.plannedDate);
      if (!noDateTasks.length) {
        noDateGroup.innerHTML += '<p class="text-xs text-slate-400 bg-white border border-app-border p-3 rounded-xl">Nenhum item sem data.</p>';
      } else {
        noDateTasks.forEach(t => noDateGroup.appendChild(createTaskElement(t)));
      }
      planGroups.appendChild(noDateGroup);

      // Próximos dias
      for (let i = 1; i <= 7; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const dayTasks = tasks.filter(t => t.plannedDate === dateStr);

        const groupDiv = document.createElement('div');
        groupDiv.className = 'space-y-2';
        const label = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' });
        groupDiv.innerHTML = `<h3 class="text-xs font-bold text-app-muted uppercase tracking-wider capitalize">${label}</h3>`;

        if (!dayTasks.length) {
          groupDiv.innerHTML += '<p class="text-xs text-slate-400 bg-white border border-app-border p-3 rounded-xl">Sem tarefas agendadas.</p>';
        } else {
          dayTasks.forEach(t => groupDiv.appendChild(createTaskElement(t)));
        }
        planGroups.appendChild(groupDiv);
      }

      // Render Projetos
      const projList = document.getElementById('projects-list');
      projList.innerHTML = '';
      projects.forEach(p => {
        const count = tasks.filter(t => t.projectId === p.id && t.status !== 'completed').length;
        const div = document.createElement('div');
        div.className = 'bg-white border border-app-border rounded-xl p-3.5 flex items-center justify-between shadow-sm';
        div.innerHTML = `
          <div class="flex items-center gap-2.5">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${p.color}"></span>
            <span class="text-sm font-semibold text-app-text">${p.name}</span>
          </div>
          <span class="text-xs font-bold text-app-muted bg-slate-100 px-2.5 py-0.5 rounded-full">${count} abertas</span>
        `;
        projList.appendChild(div);
      });

      lucide.createIcons();
    }

    render();
  </script>
</body>
</html>
