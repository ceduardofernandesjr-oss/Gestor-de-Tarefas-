<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tarefas | Minimal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            app: {
              bg: '#F8FAFC',
              card: '#FFFFFF',
              primary: '#4F46E5',
              primaryHover: '#4338CA',
              text: '#0F172A',
              muted: '#475569',
              border: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-target {
      min-height: 48px;
      min-width: 48px;
    }
    .sheet-transition {
      transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1), opacity 220ms ease;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased select-none pb-24">

  <!-- Top Bar -->
  <header class="sticky top-0 z-20 bg-app-card/90 backdrop-blur-md border-b border-app-border px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-app-primary flex items-center justify-center text-white font-bold text-sm shadow-sm">
          T
        </div>
        <div>
          <h1 class="text-sm font-semibold tracking-tight text-app-text">Minhas Tarefas</h1>
          Hoje


        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openNewTaskSheet()" class="touch-target px-3 py-1.5 bg-app-primary hover:bg-app-primaryHover text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition active:scale-95 shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>Nova</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Areas -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 pt-5">

    <!-- View: Hoje -->
    <section id="view-today" class="space-y-5">
      <!-- Resumo do Dia -->
      <div class="flex items-center justify-between px-1">
        <div>
          <h2 class="text-xl font-bold tracking-tight text-app-text">Hoje</h2>
          0 tarefas pendentes


        </div>
        <div class="text-right">
          <span id="completion-badge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-app-muted border border-app-border">
            0% concluído
          </span>
        </div>
      </div>

      <!-- Caixa de Entrada Card -->
      <div onclick="filterByInbox()" class="bg-app-card border border-app-border rounded-2xl p-4 flex items-center justify-between active:bg-slate-50 transition cursor-pointer shadow-sm">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-50 text-app-primary flex items-center justify-center">
            <i data-lucide="inbox" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-sm font-semibold text-app-text">Caixa de Entrada</h3>
